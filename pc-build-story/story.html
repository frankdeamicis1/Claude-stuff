<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Build Story</title>
<!--
  Animated reel for a voiceover: Frank takes a gaming PC from plan to
  hand-off (plan, buy, build, stress test, sell). 1080x1920, 30 fps, 59 s. Everything is driven by renderFrame(t) so the
  render script can capture it frame-by-frame. Open this file in Chrome to
  preview (space = play/pause, drag the slider to scrub).
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #04060c; }
  #stage { width: 1080px; height: 1920px; overflow: hidden; background: #070a14; transform-origin: 0 0; }
  svg { display: block; }
  .hd { font-family: "Inter Display", "Inter", sans-serif; font-weight: 900; }
  .bd { font-family: "Inter", "Inter Display", sans-serif; font-weight: 800; }
  .md { font-family: "Inter", "Inter Display", sans-serif; font-weight: 600; }
  .mono { font-family: "JetBrains Mono", monospace; font-weight: 800; }
  .tn { font-feature-settings: "tnum" 1; }
  body.preview { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px; color: #cfd8ee; font: 14px Inter, system-ui, sans-serif; }
  #ui { display: none; gap: 8px; align-items: center; width: min(540px, 92vw); }
  body.preview #ui { display: flex; }
  #scrub { flex: 1; }
  button { font: inherit; padding: 4px 10px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
<div id="ui"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="60.5" step="0.0333" value="0"><span id="tc">0.00s</span></div>
<script>
'use strict';
const W = 1080, H = 1920, FPS = 30;
// [realTime, designTime] knots: the stress-test step gets 1 extra second for the voiceover.
const WARP = [[0, 0], [35, 35], [45, 44], [60.5, 59.5]];
const DUR = WARP[WARP.length - 1][0];
function warpMap(x, from, to) {
  for (let i = 1; i < WARP.length; i++) {
    const a = WARP[i - 1], b = WARP[i];
    if (x <= b[from] || i === WARP.length - 1) return a[to] + (b[to] - a[to]) * (x - a[from]) / (b[from] - a[from]);
  }
}
const toDesign = T => warpMap(T, 0, 1), toReal = t => warpMap(t, 1, 0);
const RENDER = /[?&]render=1/.test(location.search);
// base = everything but captions, captions = only the karaoke captions (transparent), all = both
const LAYER = new URLSearchParams(location.search).get('layer') || (RENDER ? 'base' : 'all');
const svg = document.getElementById('svg');

/* ------------------------------------------------------------------ utils */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const EASE = {
  lin: x => x,
  in: x => x * x * x,
  out: x => 1 - Math.pow(1 - x, 3),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outBig: x => { const c1 = 2.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  sine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  step: x => x < 1 ? 0 : 1,
};
const mix = (a, b, k) => Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * k) : a + (b - a) * k;
function tk(keys, t) {               // keyframes: [time, value, easeIntoThisKey]
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1, e] = keys[i];
      const p = t1 > t0 ? (t - t0) / (t1 - t0) : 1;
      return mix(v0, v1, EASE[e || 'inOut'](p));
    }
  }
  return keys[keys.length - 1][1];
}
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => Math.round(n).toLocaleString('en-US');
const $ = id => document.getElementById(id);
const P = (x, y) => `${x.toFixed(1)},${y.toFixed(1)}`;
const pulse = (t, t0, a, h, r) => t < t0 || t > t0 + a + h + r ? 0 : t < t0 + a ? (t - t0) / a : t < t0 + a + h ? 1 : 1 - (t - t0 - a - h) / r;

/* ---------------------------------------------------------------- palette */
const C = {

/* ---------------------------------------------------- character geometry

/* ------------------------------------------------------------------ defs */

  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="peg" width="46" height="46" patternUnits="userSpaceOnUse"><circle cx="23" cy="23" r="5" fill="#05070e"/><path d="M 18,20 A 5 5 0 0 1 28,20" fill="none" stroke="#202a4a" stroke-width="1.6"/></pattern>

  <clipPath id="eyeClip"><path d="${EYE_D}"/></clipPath>
  <clipPath id="scanClip"><rect id="scanRect" x="-400" y="-225" width="800" height="0"/></clipPath>
  <clipPath id="laneClipA"><rect x="-420" y="-250" width="840" height="236" rx="10"/></clipPath>
  <clipPath id="laneClipB"><rect x="-420" y="14" width="840" height="236" rx="10"/></clipPath>
</defs>`;
}

    <g clip-path="url(#eyeClip)"><g id="iris${s}"><circle r="9.6" fill="#3a2416"/><circle r="4.7" fill="#0d0705"/><circle cx="3.2" cy="-3.2" r="2.4" fill="#fff"/></g></g>
    <path d="M -14,8 C -6,11 6,11 14,8" stroke="${C.skinD}" stroke-width="2" fill="none" opacity=".7"/>
    <g id="lid${s}"><path id="lidF${s}" d="M -26,-1 C -12,-6 12,-6 26,-1 L 26,-30 L -26,-30 Z" fill="${C.skin}"/>
      <path id="lidL${s}" d="M -23,-1 C -12,-6 12,-6 23,-1" stroke="#160d09" stroke-width="4.5" fill="none" stroke-linecap="round"/></g>`;
}
function strands(seed, n, box, color, w, op) {
  const r = rng(seed); let s = '';
  for (let i = 0; i < n; i++) {
    const x = lerp(box[0], box[2], r()), y = lerp(box[1], box[3], r());
    const dx = (r() - .5) * 18, len = 18 + r() * 26, curl = (r() - .5) * 16;
    s += `<path d="M ${P(x, y)} q ${P(curl, len * .5)} ${P(dx, len)}" stroke="${color}" stroke-width="${w}" fill="none" stroke-linecap="round" opacity="${op}"/>`;
  }
  return s;
}
function frankBody() {

      <path d="M 146,-220 C 156,-170 140,-140 158,-96 C 170,-62 160,-30 178,8 C 186,26 180,40 186,52" stroke="${C.hairL}" stroke-width="5" fill="none" stroke-linecap="round"/>

      <path d="M -56,-247 C -56,-286 -30,-304 0,-304 C 30,-304 56,-286 56,-247 Z" fill="${C.hairM}" stroke="${C.out}" stroke-width="4" stroke-linejoin="round"/>
      <path d="M -40,-262 C -30,-280 -12,-292 6,-292" stroke="${C.hairL}" stroke-width="3" fill="none"/>
      <rect x="-76" y="-268" width="144" height="32" rx="15" fill="${C.strap}"/>
      <g clip-path="url(#strapClip)"><rect x="-76" y="-268" width="68" height="32" fill="${C.cow}"/>
        <ellipse cx="-62" cy="-261" rx="9" ry="5" transform="rotate(-20,-62,-261)" fill="${C.cowSpot}"/><ellipse cx="-37" cy="-245" rx="9" ry="6" transform="rotate(14,-37,-245)" fill="${C.cowSpot}"/>

/* ------------------------------------------------------------ rig: arms/IK */
const SHO = { L: [-212, 104], R: [212, 104] }, L1 = 190, L2 = 170;
const PREF = { L: [-0.55, 0.83], R: [0.55, 0.83] };
function solveArm(s, T, pref, k = 1) {
  const S = SHO[s]; let dx = T[0] - S[0], dy = T[1] - S[1]; let d = Math.hypot(dx, dy) || 1e-3;
  const L1 = 190 * k, L2 = 170 * k;
  const maxD = L1 + L2 - 1, minD = Math.abs(L1 - L2) + 30;
  if (d > maxD) { const k = maxD / d; dx *= k; dy *= k; d = maxD; } else if (d < minD) { const k = minD / d; dx *= k; dy *= k; d = minD; }
  const ux = dx / d, uy = dy / d, a = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const nx = -uy, ny = ux, pr = pref || PREF[s];
  const sg = (nx * pr[0] + ny * pr[1]) >= 0 ? 1 : -1;
  return { S, E: [S[0] + ux * a + nx * h * sg, S[1] + uy * a + ny * h * sg], W: [S[0] + dx, S[1] + dy] };
}
const angTo = (a, b) => Math.atan2(-(b[0] - a[0]), b[1] - a[1]) * 180 / Math.PI;
function drawArm(s, A) {
  const { S, E, W: Wr } = A;
  const p1 = `M${P(S[0], S[1])} L${P(E[0], E[1])}`, p2 = `M${P(E[0], E[1])} L${P(Wr[0], Wr[1])}`;
  $(`a${s}o1`).setAttribute('d', p1); $(`a${s}s1`).setAttribute('d', p1);
  $(`a${s}o2`).setAttribute('d', p2); $(`a${s}s2`).setAttribute('d', p2);
  const ux = E[0] - S[0], uy = E[1] - S[1], len = Math.hypot(ux, uy) || 1, vx = ux / len, vy = uy / len, px = -vy, py = vx;
  const sl = Math.min(len * .62, 118), B = [S[0] - vx * 4, S[1] - vy * 4], Pp = [S[0] + vx * sl, S[1] + vy * sl], hw = 61;
  const dS = `M${P(B[0], B[1])} L${P(Pp[0], Pp[1])}`;
  $(`a${s}slO`).setAttribute('d', dS); $(`a${s}slF`).setAttribute('d', dS);
  for (const id of [`a${s}slOc`, `a${s}slFc`]) { $(id).setAttribute('cx', B[0].toFixed(1)); $(id).setAttribute('cy', B[1].toFixed(1)); }
  $(`a${s}hem`).setAttribute('d', `M${P(Pp[0] + px * hw, Pp[1] + py * hw)} L${P(Pp[0] - px * hw, Pp[1] - py * hw)}`);
  const Ph = [Pp[0] - vx * 9, Pp[1] - vy * 9];
  $(`a${s}hem2`).setAttribute('d', `M${P(Ph[0] + px * (hw - 4), Ph[1] + py * (hw - 4))} L${P(Ph[0] - px * (hw - 4), Ph[1] - py * (hw - 4))}`);
  $(`a${s}hair`).setAttribute('transform', `translate(${P(E[0], E[1])}) rotate(${angTo(E, Wr).toFixed(1)})`);
}
const HANDS = ['relax', 'fist', 'point', 'flat', 'spread', 'thumb'];
function drawHand(s, A, shape, rot) {
  const a = rot == null ? angTo(A.E, A.W) : rot;
  $(`h${s}`).setAttribute('transform', `translate(${P(A.W[0], A.W[1])}) rotate(${a.toFixed(1)})`);
  for (const h of HANDS) $(`h${s}_${h}`).setAttribute('display', h === shape ? 'inline' : 'none');
}

function limbMarkup(id, sleeve) {
  return `<g id="${id}"><path id="${id}o" stroke="${C.out}" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path id="${id}f" stroke="${sleeve}" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path id="${id}c" stroke="${C.hoodD}" stroke-width="12" fill="none" stroke-linecap="round"/></g>`;
}
function limbUpdate(id, A) {
  const { S, E, W: Wr } = A, d = `M${P(S[0], S[1])} L${P(E[0], E[1])} L${P(Wr[0], Wr[1])}`;
  $(id + 'o').setAttribute('d', d); $(id + 'f').setAttribute('d', d);
  const vx = Wr[0] - E[0], vy = Wr[1] - E[1], L = Math.hypot(vx, vy) || 1, ux = vx / L, uy = vy / L, px = -uy, py = ux;
  const c0 = [Wr[0] - ux * 10, Wr[1] - uy * 10];
  $(id + 'c').setAttribute('d', `M${P(c0[0] + px * 38, c0[1] + py * 38)} L${P(c0[0] - px * 38, c0[1] - py * 38)}`);
}
function ikSolve(S, T, L1, L2, pref) {
  let dx = T[0] - S[0], dy = T[1] - S[1]; let d = Math.hypot(dx, dy) || 1e-3;
  const maxD = L1 + L2 - 1, minD = Math.abs(L1 - L2) + 30;
  if (d > maxD) { const k = maxD / d; dx *= k; dy *= k; d = maxD; } else if (d < minD) { const k = minD / d; dx *= k; dy *= k; d = minD; }
  const ux = dx / d, uy = dy / d, a = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const nx = -uy, ny = ux, sg = (nx * pref[0] + ny * pref[1]) >= 0 ? 1 : -1;
  return { S, E: [S[0] + ux * a + nx * h * sg, S[1] + uy * a + ny * h * sg], W: [S[0] + dx, S[1] + dy] };
}

  $('flash').setAttribute('opacity', Math.max(pulse(t, 30.6, .01, .02, .1) * .16, pulse(t, POWER_ON, .02, .02, .2) * .14, pulse(t, 41.4, .01, .02, .12) * .14).toFixed(3));
}

/* ------------------------------------------------------------ audio cue list (read by make_audio.py) */
const popT = TXT.filter(([, , , ty]) => ty === 'pop' || ty === 'slam').map(([, a]) => Math.max(.05, a));
const CUE_D = {
  whoosh: [5.9, 9.45, 17.95, 25.95, 34.95, 43.95, 50.95],
  pop: [...popT, 6.6, 6.9, 7.2, 7.5, 7.8, 18.05, 26.05, 35.05, 35.4],
  tick: [Wd(2, 9), Wd(2, 9) + .4, Wd(2, 9) + .8, Wd(2, 9) + 1.2, 18.4, 18.51, 18.62, 18.73, 18.84, 18.95, 19.06],
  chime: [FIT_T], kaching: [19.3], thump: BOXES.map(b => b[6]), check: BOXES.map(b => b[6] + .04), stamp: [Wd(3, 11), 41.4],
  click: PARTS.map(p => p[1]), zip: ZIPS, glass: [GLASS_ON], power: [POWER_ON], fanUp: [35.3], fanHum: [35.6, 41.4],
  blips: Array.from({ length: 19 }, (_, i) => 35.7 + i * .3), pass: [41.4], steps: [44.4, 44.7, 45.0, 45.3, 50.1, 50.4, 50.7],
  slide: [45.5, 46.5], popper: [46.8], yay: [46.9], ding: [Wd(7, 3)], impacts: [30.6, Wd(7, 3)], endHit: [58.6],
};
const R = x => Array.isArray(x) ? x.map(R) : +toReal(x).toFixed(3);
window.CUES = { bpm: 100, duration: DUR, sections: { intro: R([0, 6]), plan: R([10, 18]), buy: R([18, 26]), build: R([26, 35]), test: R([35, 44]), yours: R([44, 51]), cta: [+toReal(51).toFixed(3), DUR] } };
for (const k in CUE_D) window.CUES[k] = R(CUE_D[k]);
window.VO_TIMING = VOW.map(ws => ws.map(w => [w.w, +w.t0.toFixed(2)]));


/* ------------------------------------------------------------ boot */
if (LAYER === 'captions') {
  for (const el of svg.children) if (el.tagName !== 'defs' && el.id !== 'ov') el.setAttribute('display', 'none');
  for (const el of $('ov').children) if (el.id !== 'cap') el.setAttribute('display', 'none');
  for (const el of [document.documentElement, document.body, $('stage')]) el.style.background = 'transparent';
}
window.renderFrame = renderFrame;
renderFrame(0);
window.READY = true;

if (!RENDER) {
  document.body.classList.add('preview');
  const stage = $('stage'), wrap = $('wrap');
  const fit = () => { const k = Math.min((innerHeight - 70) / 1920, (innerWidth - 20) / 1080); stage.style.transform = `scale(${k})`; wrap.style.width = 1080 * k + 'px'; wrap.style.height = 1920 * k + 'px'; };
  fit(); addEventListener('resize', fit);
  let playing = true, t0 = performance.now(), tCur = 0;
  const scrub = $('scrub'), tc = $('tc'), btn = $('play');
  const loop = now => { if (playing) { tCur = ((now - t0) / 1000) % DUR; scrub.value = tCur; } renderFrame(tCur); tc.textContent = tCur.toFixed(2) + 's'; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  const toggle = () => { playing = !playing; btn.textContent = playing ? 'Pause' : 'Play'; t0 = performance.now() - tCur * 1000; };
  btn.onclick = toggle; addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
  scrub.oninput = () => { tCur = +scrub.value; t0 = performance.now() - tCur * 1000; };
}
</script>
